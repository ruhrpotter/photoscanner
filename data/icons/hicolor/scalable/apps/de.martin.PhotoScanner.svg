<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title description">
  <title id="title">Photo Scanner</title>
  <desc id="description">Two detected photos crossed by a precise scanning beam</desc>

  <!-- Deep indigo keeps the mark calm and recognizable in light and dark shells. -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="#101b4d"/>

  <!-- Detection corners form a scanner bed without drawing a literal machine. -->
  <path d="M24 39V27a5 5 0 0 1 5-5h12v7H31v10Zm63-17h12a5 5 0 0 1 5 5v12h-7V29H87ZM24 89h7v10h10v7H29a5 5 0 0 1-5-5Zm73 0h7v12a5 5 0 0 1-5 5H87v-7h10Z" fill="#5b8def"/>

  <!-- Two physical photos communicate automatic separation at a glance. -->
  <g transform="rotate(-7 60 61)">
    <rect x="34" y="29" width="56" height="65" rx="7" fill="#fff8e8"/>
    <rect x="42" y="38" width="40" height="43" rx="3" fill="#5b8def"/>
    <path d="M42 69 54 56l8 8 7-7 13 13v11H42Z" fill="#101b4d"/>
    <circle cx="71" cy="49" r="4" fill="#fff8e8"/>
  </g>
  <g transform="rotate(8 86 78)">
    <rect x="66" y="56" width="39" height="49" rx="6" fill="#fff8e8"/>
    <rect x="73" y="64" width="25" height="31" rx="2" fill="#5b8def"/>
    <path d="M73 87 82 77l5 6 4-4 7 8v8H73Z" fill="#101b4d"/>
  </g>

  <!-- The single coral beam is the visual signature of the scanning action. -->
  <rect x="18" y="62" width="92" height="7" rx="3.5" fill="#ff5d62"/>
</svg>
