[package]
name = "photoscanner"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
description = "Native Linux-Anwendung zum Scannen und automatischen Aufteilen von Papierfotos"
license = "MIT"
publish = false
readme = "README.md"
keywords = ["scanner", "photos", "sane", "gtk4"]
categories = ["multimedia::images"]

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_9", "gtk_v4_22"] }
anyhow = "1.0"
async-channel = "2.5"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.5"
dirs = "6.0"
filetime = "0.2"
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_22"] }
opencv = { version = "0.100.1", default-features = false, features = ["clang-runtime", "geometry", "imgcodecs", "imgproc"] }
tempfile = "3.23"
thiserror = "2.0"
wait-timeout = "0.2"

[profile.release]
lto = "thin"
strip = "debuginfo"
