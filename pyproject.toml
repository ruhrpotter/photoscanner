[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-scanner"
version = "0.1.0"
description = "TUI zum Scannen und automatischen Aufteilen mehrerer Papierfotos"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Martin" },
]
dependencies = [
  "numpy>=2.0,<3",
  "opencv-python-headless>=5.0,<6",
  "Pillow>=11,<13",
  "rich>=13,<16",
]

[project.scripts]
photoscanner = "photoscanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
